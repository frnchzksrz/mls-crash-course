<script>
  (function() {
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      // Find the base folder (e.g., '/human-atlas/')
      const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
      
      if (typeof input === 'string' && input.startsWith('/models/')) {
        // Rewrite '/models/atlas.json' to '/human-atlas/models/atlas.json'
        input = basePath + input.substring(1);
      } else if (input instanceof Request && input.url.includes('/models/')) {
        const urlObj = new URL(input.url);
        urlObj.pathname = basePath + urlObj.pathname.substring(1);
        input = new Request(urlObj.href, input);
      }
      return originalFetch.call(this, input, init);
    };
  })();
</script>
