<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up / Login – MLS Crash Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1e1e1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow-x: hidden; }
    .diamond { position: fixed; width: 18px; height: 18px; background: #1e3b5a; transform: rotate(45deg); opacity: 0; pointer-events: none; z-index: 0; animation: sparkle 4s infinite; }
    @keyframes sparkle { 0% { opacity: 0; transform: rotate(45deg) scale(0.6); } 20% { opacity: 0.2; } 50% { opacity: 0.5; transform: rotate(45deg) scale(1); } 80% { opacity: 0.2; } 100% { opacity: 0; transform: rotate(45deg) scale(0.6); } }
    .form-wrapper { position: relative; z-index: 2; width: 100%; max-width: 440px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(30,59,90,0.12); border-radius: 24px; padding: 2.5rem 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.05); margin: 1rem; }
    .logo { text-align: center; font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: #1e3b5a; margin-bottom: 0.25rem; }
    .logo span { display: block; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.15em; color: #5c7c9e; text-transform: uppercase; margin-top: -0.2rem; }
    .logo i { font-style: italic; }
    .toggle-buttons { display: flex; gap: 0.5rem; margin: 2rem 0 1.5rem; border-bottom: 1px solid rgba(30,59,90,0.1); }
    .toggle-btn { flex: 1; background: none; border: none; padding: 0.6rem; font-size: 1rem; font-weight: 600; color: #5c7c9e; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
    .toggle-btn.active { color: #1e3b5a; border-bottom-color: #1e3b5a; }
    .form-panel { display: none; }
    .form-panel.active { display: block; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.3rem; color: #1e3b5a; }
    input { width: 100%; padding: 0.75rem 1rem; border: 1px solid rgba(30,59,90,0.15); border-radius: 12px; font-size: 1rem; font-family: inherit; background: #fafbfc; transition: border 0.2s; }
    input:focus { outline: none; border-color: #1e3b5a; background: #fff; }
    .submit-btn { width: 100%; padding: 0.8rem; background: #1e3b5a; color: #fff; font-weight: 600; font-size: 1rem; border: none; border-radius: 12px; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s; }
    .submit-btn:hover { background: #162d45; }
    .form-message { margin: 0.5rem 0; font-size: 0.85rem; text-align: center; }
    .error-msg { color: #c0392b; }
    .success-msg { color: #1e3b5a; background: #f0f4f8; padding: 0.5rem; border-radius: 8px; }
    .forgot-link { font-size: 0.8rem; text-align: right; margin-top: -0.5rem; margin-bottom: 0.5rem; }
    .forgot-link a { color: #5c7c9e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="form-wrapper">
    <div class="logo">
      MLS Crash Course <i>by RF</i>
      <span>Medical Laboratory Science</span>
    </div>

    <div class="toggle-buttons">
      <button class="toggle-btn active" data-panel="login">Log In</button>
      <button class="toggle-btn" data-panel="signup">Sign Up</button>
    </div>

    <div class="form-panel active" id="login-panel">
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="forgot-link"><a href="#">Forgot password?</a></div>
        <div id="login-message" class="form-message"></div>
        <button type="submit" class="submit-btn">Log In</button>
      </form>
    </div>

    <div class="form-panel" id="signup-panel">
      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Juan Dela Cruz" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="••••••••" required minlength="6">
        </div>
        <div id="signup-message" class="form-message"></div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
    </div>
  </div>

  <script>
    (function createDiamonds() {
      for (let i = 0; i < 15; i++) {
        const diamond = document.createElement('div');
        diamond.className = 'diamond';
        diamond.style.left = Math.random() * 100 + '%';
        diamond.style.top = Math.random() * 100 + '%';
        diamond.style.animationDelay = Math.random() * 4 + 's';
        diamond.style.width = (10 + Math.random() * 15) + 'px';
        diamond.style.height = diamond.style.width;
        document.body.appendChild(diamond);
      }
    })();

    document.addEventListener('DOMContentLoaded', function() {
      let supabaseClient;
      try {
        if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
          document.getElementById('login-message').innerHTML = '<div class="error-msg">Configuration error. Check config.js.</div>';
          return;
        }
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (e) {
        document.getElementById('login-message').innerHTML = '<div class="error-msg">Failed to initialize Supabase.</div>';
        return;
      }

      const loginMsg = document.getElementById('login-message');
      const signupMsg = document.getElementById('signup-message');

      function showMessage(el, text, isError) {
        el.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`;
      }

      const toggleBtns = document.querySelectorAll('.toggle-btn');
      const panels = {
        login: document.getElementById('login-panel'),
        signup: document.getElementById('signup-panel')
      };

      toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.panel;
          toggleBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          for (let key in panels) panels[key].classList.toggle('active', key === target);
          loginMsg.innerHTML = '';
          signupMsg.innerHTML = '';
        });
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        if (!email || !password) { showMessage(loginMsg, 'Please fill in all fields.', true); return; }
        try {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            if (error.message.includes('Invalid login credentials')) showMessage(loginMsg, 'Invalid email or password.', true);
            else showMessage(loginMsg, error.message, true);
            return;
          }
          window.location.href = 'index.html';
        } catch (err) {
          showMessage(loginMsg, 'Error: ' + (err.message || 'Unknown error'), true);
        }
      });

      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        if (!name || !email || !password) { showMessage(signupMsg, 'Please fill in all fields.', true); return; }
        try {
          const { error } = await supabaseClient.auth.signUp({
            email, password,
            options: { data: { full_name: name } }
          });
          if (error) {
            if (error.message.toLowerCase().includes('already registered') || error.message.toLowerCase().includes('already exists')) {
              showMessage(signupMsg, 'User already registered. Go to log in.', true);
            } else {
              showMessage(signupMsg, error.message, true);
            }
            return;
          }
          showMessage(signupMsg, 'Account created! Redirecting…');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } catch (err) {
          showMessage(signupMsg, 'Error: ' + (err.message || 'Unknown error'), true);
        }
      });
    });
  </script>
</body>
</html>
