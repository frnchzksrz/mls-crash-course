<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Anatomy Atlas · MLS Crash Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0f1a26; }
    body { font-family: 'Inter', sans-serif; color: #e8eef5; display: flex; flex-direction: column; }
    
    header { z-index: 100; background: rgba(15,26,38,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; height: 70px; flex-shrink: 0; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: #8ab4d9; text-decoration: none; }
    .logo span { font-size: 0.75rem; color: #6b8ba3; display: block; text-transform: uppercase; letter-spacing: 0.2em; margin-top: -0.2rem; }
    .nav-links { display: flex; align-items: center; gap: 1.75rem; }
    .nav-links a { text-decoration: none; color: #b8c5d1; font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
    .nav-links a:hover { color: #e8eef5; }
    .nav-links a.active { color: #f6c445; }
    
    /* The main container takes up all remaining height below the header */
    .main-container { flex: 1; position: relative; width: 100%; }
    
    /* Absolute positioning guarantees it fills the main container perfectly */
    #canvas-container { position: absolute; inset: 0; background: radial-gradient(circle at center, #162536 0%, #0f1a26 100%); }
    
    /* Left Sidebar */
    .system-panel { position: absolute; top: 20px; left: 20px; background: rgba(26,43,61,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.25rem; width: 280px; max-height: calc(100% - 40px); overflow-y: auto; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .system-panel h3 { font-family: 'Playfair Display', serif; font-size: 1rem; color: #8ab4d9; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 0.9rem; color: #e8eef5; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    .toggle-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4a5a6b; transition: .4s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #8ab4d9; }
    input:checked + .slider:before { transform: translateX(18px); }
    
    /* Right Info Panel */
    .info-panel { position: absolute; top: 20px; right: 20px; background: rgba(26,43,61,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; width: 320px; max-height: calc(100% - 40px); overflow-y: auto; display: none; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .info-panel.visible { display: block; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .info-panel h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #f6c445; margin-bottom: 0.2rem; }
    .info-panel .type { font-size: 0.75rem; color: #8ab4d9; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; display: block; }
    .info-panel .mls-correlation { background: rgba(138,180,217,0.1); border-left: 3px solid #8ab4d9; padding: 0.8rem; border-radius: 0 8px 8px 0; margin-bottom: 1rem; }
    .info-panel .mls-correlation h4 { font-size: 0.8rem; color: #8ab4d9; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .info-panel p { font-size: 0.9rem; color: #e8eef5; line-height: 1.5; margin-bottom: 1rem; }
    .info-panel .mls-link { display: inline-block; background: #1e3b5a; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; transition: background 0.2s, transform 0.2s; }
    .info-panel .mls-link:hover { background: #2d4a6b; transform: translateY(-2px); }
    #close-info { float: right; background: none; border: none; color: #8ab4d9; font-size: 1.5rem; cursor: pointer; padding: 0 5px; line-height: 1; }
    
    .instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,26,38,0.8); backdrop-filter: blur(4px); color: #b8c5d1; font-size: 0.85rem; padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); pointer-events: none; display: flex; gap: 1rem; align-items: center; }
    .key-badge { background: #2d4a6b; color: #fff; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }

    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f1a26; z-index: 50; transition: opacity 0.5s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(138,180,217,0.3); border-top-color: #8ab4d9; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .system-panel { width: calc(100% - 40px); max-height: 30vh; top: 10px; left: 10px; }
      .info-panel { width: calc(100% - 40px); top: auto; bottom: 60px; left: 10px; max-height: 40vh; }
      .instructions { display: none; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">MLS Crash Course <i>by RF</i><span class="sub">Medical Laboratory Science</span></a>
    <nav class="nav-links">
      <a href="courses.html">Courses</a>
      <a href="focus.html">Focus</a>
      <a href="community.html">Community</a>
      <a href="atlas.html">Atlas</a>
      <a href="anatomy.html" class="active">3D Anatomy</a>
    </nav>
  </header>

  <main class="main-container">
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading anatomical systems…</p>
    </div>
    
    <div id="canvas-container"></div>
    
    <div class="system-panel">
      <h3>Systems & Layers</h3>
      <div id="system-toggles"></div>
    </div>
    
    <div class="info-panel" id="info-panel">
      <button id="close-info">×</button>
      <h2 id="info-title">Structure Name</h2>
      <span class="type" id="info-type">System</span>
      <div class="mls-correlation">
        <h4>In MLS</h4>
        <p id="info-desc" style="margin-bottom: 0;"></p>
      </div>
      <a href="#" class="mls-link" id="info-mls-link">View related course →</a>
    </div>

    <div class="instructions">
      <span><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> to Pan</span>
      <span><span class="key-badge">Q</span><span class="key-badge">E</span> to Zoom</span>
      <span>🖱️ Left-click to rotate</span>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const container = document.getElementById('canvas-container');
    const infoPanel = document.getElementById('info-panel');
    const infoTitle = document.getElementById('info-title');
    const infoType = document.getElementById('info-type');
    const infoDesc = document.getElementById('info-desc');
    const infoMlsLink = document.getElementById('info-mls-link');
    const toggleContainer = document.getElementById('system-toggles');
    const loadingText = document.querySelector('#loading p');

    // Expanded MLS Data mapping
    const mlsData = {
      'heart': { type: 'Cardiovascular', inMls: 'Cardiac markers like Troponin I and CK-MB are measured here. Blood typing is vital for cardiac surgeries.', link: 'course-clinical-chemistry.html', linkText: 'Clinical Chemistry' },
      'liver': { type: 'Digestive', inMls: 'Liver Function Tests (ALT, AST, ALP, Bilirubin) are core. The liver produces clotting factors evaluated in Coagulation.', link: 'course-clinical-chemistry.html', linkText: 'Clinical Chemistry' },
      'kidney': { type: 'Urinary', inMls: 'Urinalysis, creatinine clearance, and BUN assess renal function. The kidney produces erythropoietin.', link: 'course-analysis-of-urine.html', linkText: 'Urinalysis' },
      'lung': { type: 'Respiratory', inMls: 'Sputum cultures for Mycobacterium tuberculosis and fungal infections are vital.', link: 'course-microbiology.html', linkText: 'Microbiology' },
      'brain': { type: 'Nervous', inMls: 'Cerebrospinal fluid (CSF) is analyzed to diagnose meningitis and subarachnoid hemorrhage.', link: 'course-analysis-of-urine.html', linkText: 'Body Fluids' },
      'bone': { type: 'Skeletal', inMls: 'Bone marrow is the site of hematopoiesis. Aspirates diagnose leukemias and anemias.', link: 'course-clinical-hematology.html', linkText: 'Hematology' },
      'rib': { type: 'Skeletal', inMls: 'Bone marrow aspirates are often taken from the posterior iliac crest, but ribs contain active marrow.', link: 'course-clinical-hematology.html', linkText: 'Hematology' },
      'skull': { type: 'Skeletal', inMls: 'The skull protects the brain. Cranial bones are assessed in skeletal surveys and forensic pathology.', link: 'course-histopathology.html', linkText: 'Histopathology' },
      'vertebra': { type: 'Skeletal', inMls: 'Lumbar puncture (spinal tap) is performed between the L3-L4 or L4-L5 vertebrae to collect CSF.', link: 'course-analysis-of-urine.html', linkText: 'Body Fluids' },
      'muscle': { type: 'Muscular', inMls: 'Elevated Creatine Kinase (CK) and Aldolase indicate skeletal muscle damage.', link: 'course-clinical-chemistry.html', linkText: 'Clinical Chemistry' },
      'stomach': { type: 'Digestive', inMls: 'Gastric biopsies are tested for Helicobacter pylori using the rapid urease test.', link: 'course-microbiology.html', linkText: 'Microbiology' },
      'intestine': { type: 'Digestive', inMls: 'Stool cultures and O&P (Ova and Parasite) exams assess intestinal infections.', link: 'course-microbiology.html', linkText: 'Microbiology' },
      'pancreas': { type: 'Digestive', inMls: 'Elevated serum amylase and lipase are key indicators of acute pancreatitis.', link: 'course-clinical-chemistry.html', linkText: 'Clinical Chemistry' },
      'spleen': { type: 'Lymphoid', inMls: 'The spleen filters old RBCs. Splenectomy leads to Howell-Jolly bodies on a peripheral smear.', link: 'course-clinical-hematology.html', linkText: 'Hematology' },
      'artery': { type: 'Cardiovascular', inMls: 'Arterial blood gases (ABG) are collected to evaluate oxygenation and acid-base balance.', link: 'course-clinical-chemistry.html', linkText: 'Clinical Chemistry' },
      'vein': { type: 'Cardiovascular', inMls: 'Venipuncture is the standard method for collecting venous blood for laboratory testing.', link: 'course-clinical-hematology.html', linkText: 'Hematology' }
    };

    const systems = [
      { id: 'skeleton', label: 'Skeletal System', file: 'skeleton.glb', color: '#e8dcc4' },
      { id: 'muscles', label: 'Muscular System', file: 'muscles.glb', color: '#c0392b' },
      { id: 'organs', label: 'Internal Organs', file: 'organs.glb', color: '#e67e22' },
      { id: 'nerves', label: 'Nervous System', file: 'nerves.glb', color: '#f6c445' },
      { id: 'circulatory', label: 'Circulatory System', file: 'circulatory.glb', color: '#e74c3c' },
      { id: 'lymphoid', label: 'Lymphoid Organs', file: 'lymphoid.glb', color: '#27ae60' }
    ];

    const scene = new THREE.Scene();
    scene.background = null;
    
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(2, 3, 4);
    scene.add(dirLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 10;
    controls.minDistance = 0.5;

    // --- Custom WASD + QE Movement ---
    window.addEventListener('keydown', (e) => {
      // Prevent page scrolling when using keys
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE'].includes(e.code)) {
        e.preventDefault();
      }

      const moveSpeed = 0.15;
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);

      // Q/E for forward/backward depth movement
      if (e.code === 'KeyE') {
        camera.position.add(forward.clone().multiplyScalar(moveSpeed));
        controls.target.add(forward.clone().multiplyScalar(moveSpeed));
      }
      if (e.code === 'KeyQ') {
        camera.position.sub(forward.clone().multiplyScalar(moveSpeed));
        controls.target.sub(forward.clone().multiplyScalar(moveSpeed));
      }

      // WASD for panning left/right/up/down relative to view
      const right = new THREE.Vector3();
      right.crossVectors(camera.up, forward).normalize();
      const up = new THREE.Vector3();
      up.crossVectors(forward, right).normalize();

      if (e.code === 'KeyW') { // Pan Up
        camera.position.add(up.clone().multiplyScalar(moveSpeed));
        controls.target.add(up.clone().multiplyScalar(moveSpeed));
      }
      if (e.code === 'KeyS') { // Pan Down
        camera.position.sub(up.clone().multiplyScalar(moveSpeed));
        controls.target.sub(up.clone().multiplyScalar(moveSpeed));
      }
      if (e.code === 'KeyA') { // Pan Left
        camera.position.sub(right.clone().multiplyScalar(moveSpeed));
        controls.target.sub(right.clone().multiplyScalar(moveSpeed));
      }
      if (e.code === 'KeyD') { // Pan Right
        camera.position.add(right.clone().multiplyScalar(moveSpeed));
        controls.target.add(right.clone().multiplyScalar(moveSpeed));
      }
    });

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    const loadedModels = {};
    let loadedCount = 0;

    systems.forEach(system => {
      loader.load(`assets/models/${system.file}`, (gltf) => {
        const model = gltf.scene;
        
        model.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: new THREE.Color(system.color),
              roughness: 0.4,
              metalness: 0.1,
              transparent: true,
              opacity: 0.9
            });
            child.userData.originalColor = new THREE.Color(system.color);
          }
        });

        loadedModels[system.id] = model;
        scene.add(model);

        loadedCount++;
        if (loadedCount === systems.length) finishLoading();
      }, 
      (xhr) => {
        if (xhr.total > 0 && loadingText) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingText.textContent = `Loading ${system.label}… ${percent}%`;
        }
      }, 
      (error) => {
        console.warn(`Missing file: ${system.file}`, error);
        loadedCount++;
        if (loadedCount === systems.length) finishLoading();
      });
    });

    function finishLoading() {
      document.getElementById('loading').classList.add('hidden');
      
      const box = new THREE.Box3();
      Object.values(loadedModels).forEach(m => box.expandByObject(m));
      if (box.isEmpty()) return;
      
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      
      controls.target.copy(center);
      camera.position.set(center.x, center.y, center.z + maxDim * 2);
      camera.updateProjectionMatrix();
      controls.update();
    }

    systems.forEach(system => {
      const row = document.createElement('div');
      row.className = 'toggle-row';
      row.innerHTML = `
        <span class="toggle-label">
          <span class="toggle-dot" style="background-color: ${system.color}"></span>
          ${system.label}
        </span>
        <label class="toggle-switch">
          <input type="checkbox" data-system="${system.id}" checked>
          <span class="slider"></span>
        </label>
      `;
      toggleContainer.appendChild(row);
    });

    toggleContainer.addEventListener('change', (e) => {
      if (e.target.tagName === 'INPUT') {
        const systemId = e.target.dataset.system;
        if (loadedModels[systemId]) loadedModels[systemId].visible = e.target.checked;
      }
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let lastHighlighted = null;

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return; 
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      
      const visibleMeshes = [];
      Object.values(loadedModels).forEach(model => {
        if (model.visible) {
          model.traverse(child => { if (child.isMesh) visibleMeshes.push(child); });
        }
      });

      const intersects = raycaster.intersectObjects(visibleMeshes, false);
      
      if (lastHighlighted) { lastHighlighted.material.emissive.setHex(0x000000); lastHighlighted = null; }

      if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;
        lastHighlighted = clickedMesh;
        clickedMesh.material.emissive.setHex(0x444444);
        
        const cleanName = (clickedMesh.name || clickedMesh.parent.name || 'Unknown').replace(/_/g, ' ').toLowerCase();
        
        let matchedData = null;
        for (const [key, data] of Object.entries(mlsData)) {
          if (cleanName.includes(key)) { matchedData = data; break; }
        }
        
        infoTitle.textContent = cleanName.replace(/\b\w/g, l => l.toUpperCase());
        
        if (matchedData) {
          infoType.textContent = matchedData.type;
          infoDesc.textContent = matchedData.inMls;
          infoMlsLink.href = matchedData.link;
          infoMlsLink.textContent = `Study ${matchedData.linkText} →`;
          infoMlsLink.style.display = 'inline-block';
        } else {
          infoType.textContent = 'Anatomical Structure';
          infoDesc.textContent = 'Click on a major organ or bone structure to see its Medical Laboratory Science correlation.';
          infoMlsLink.style.display = 'none';
        }
        infoPanel.classList.add('visible');
      } else {
        infoPanel.classList.remove('visible');
      }
    });

    document.getElementById('close-info').addEventListener('click', () => {
      infoPanel.classList.remove('visible');
      if (lastHighlighted) { lastHighlighted.material.emissive.setHex(0x000000); lastHighlighted = null; }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
