<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Anatomy Atlas · MLS Crash Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f1a26; color: #e8eef5; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    header { z-index: 100; background: rgba(15,26,38,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: #8ab4d9; text-decoration: none; }
    .logo span { font-size: 0.75rem; color: #6b8ba3; display: block; text-transform: uppercase; letter-spacing: 0.2em; margin-top: -0.2rem; }
    .nav-links { display: flex; align-items: center; gap: 1.75rem; }
    .nav-links a { text-decoration: none; color: #b8c5d1; font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
    .nav-links a:hover { color: #e8eef5; }
    
    .atlas-container { flex: 1; position: relative; width: 100%; background: #0f1a26; }
    .atlas-iframe { width: 100%; height: 100%; border: none; display: block; }
    
    .overlay-notice { position: absolute; bottom: 20px; right: 20px; background: rgba(26,43,61,0.9); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 16px; font-size: 0.8rem; color: #b8c5d1; pointer-events: none; z-index: 10; }
    .overlay-notice a { color: #f6c445; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">MLS Crash Course <i>by RF</i><span class="sub">Medical Laboratory Science</span></a>
    <nav class="nav-links">
      <a href="courses.html">Courses</a>
      <a href="focus.html">Focus</a>
      <a href="community.html">Community</a>
      <a href="atlas.html">Atlas</a>
      <a href="anatomy.html" style="color:#f6c445;">3D Anatomy</a>
    </nav>
  </header>

  <main class="atlas-container">
    <iframe src="human-atlas/index.html" class="atlas-iframe" title="3D Human Anatomy Explorer" allow="fullscreen"></iframe>
    <div class="overlay-notice">Powered by <a href="https://github.com/ashemag/human-atlas" target="_blank">Human Atlas</a> (CC BY 4.0)</div>
  </main>
</body>
</html>
