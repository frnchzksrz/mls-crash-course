<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Anatomy Atlas · MLS Crash Course</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f1a26; color: #e8eef5; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    
    /* Header */
    header { z-index: 100; background: rgba(15,26,38,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; height: 70px; flex-shrink: 0; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: #8ab4d9; text-decoration: none; }
    .logo span { font-size: 0.75rem; color: #6b8ba3; display: block; text-transform: uppercase; letter-spacing: 0.2em; margin-top: -0.2rem; }
    .nav-links { display: flex; align-items: center; gap: 1.75rem; }
    .nav-links a { text-decoration: none; color: #b8c5d1; font-weight: 500; font-size: 0.95rem; transition: color 0.2s; }
    .nav-links a:hover { color: #e8eef5; }
    .nav-links a.active { color: #f6c445; }
    
    /* Main Container */
    .main-container { flex: 1; display: flex; position: relative; overflow: hidden; }
    #canvas-container { flex: 1; width: 100%; height: 100%; background: radial-gradient(circle at center, #162536 0%, #0f1a26 100%); }
    
    /* System Toggles (Left Sidebar) */
    .system-panel { position: absolute; top: 20px; left: 20px; background: rgba(26,43,61,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.25rem; width: 260px; max-height: calc(100% - 40px); overflow-y: auto; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .system-panel h3 { font-family: 'Playfair Display', serif; font-size: 1rem; color: #8ab4d9; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 0.9rem; color: #e8eef5; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    .toggle-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    
    /* Toggle Switch CSS */
    .toggle-switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4a5a6b; transition: .4s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #8ab4d9; }
    input:checked + .slider:before { transform: translateX(18px); }
    
    /* Info Panel (Right Side) */
    .info-panel { position: absolute; top: 20px; right: 20px; background: rgba(26,43,61,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.5rem; width: 320px; max-height: calc(100% - 40px); overflow-y: auto; display: none; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .info-panel.visible { display: block; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .info-panel h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #f6c445; margin-bottom: 0.2rem; }
    .info-panel .type { font-size: 0.75rem; color: #8ab4d9; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; display: block; }
    .info-panel .mls-correlation { background: rgba(138,180,217,0.1); border-left: 3px solid #8ab4d9; padding: 0.8rem; border-radius: 0 8px 8px 0; margin-bottom: 1rem; }
    .info-panel .mls-correlation h4 { font-size: 0.8rem; color: #8ab4d9; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .info-panel p { font-size: 0.9rem; color: #e8eef5; line-height: 1.5; margin-bottom: 1rem; }
    .info-panel .mls-link { display: inline-block; background: #1e3b5a; color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; transition: background 0.2s, transform 0.2s; }
    .info-panel .mls-link:hover { background: #2d4a6b; transform: translateY(-2px); }
    #close-info { float: right; background: none; border: none; color: #8ab4d9; font-size: 1.5rem; cursor: pointer; padding: 0 5px; line-height: 1; }
    
    /* Help / Instructions */
    .instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15,26,38,0.8); backdrop-filter: blur(4px); color: #b8c5d1; font-size: 0.85rem; padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); pointer-events: none; display: flex; gap: 1rem; align-items: center; }
    .key-badge { background: #2d4a6b; color: #fff; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; }

    /* Loading */
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f1a26; z-index: 50; transition: opacity 0.5s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(138,180,217,0.3); border-top-color: #8ab4d9; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .system-panel { width: calc(100% - 40px); max-height: 30vh; top: 10px; left: 10px; }
      .info-panel { width: calc(100% - 40px); top: auto; bottom: 60px; left: 10px; max-height: 40vh; }
      .instructions { display: none; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">MLS Crash Course <i>by RF</i><span class="sub">Medical Laboratory Science</span></a>
    <nav class="nav-links">
      <a href="courses.html">Courses</a>
      <a href="focus.html">Focus</a>
      <a href="community.html">Community</a>
      <a href="atlas.html">Atlas</a>
      <a href="anatomy.html" class="active">3D Anatomy</a>
    </nav>
  </header>

  <main class="main-container">
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading anatomy models…</p>
    </div>
    
    <div id="canvas-container"></div>
    
    <!-- Left Sidebar -->
    <div class="system-panel">
      <h3>Systems & Layers</h3>
      <div id="system-toggles"></div>
    </div>
    
    <!-- Right Info Panel -->
    <div class="info-panel" id="info-panel">
      <button id="close-info">×</button>
      <h2 id="info-title">Structure Name</h2>
      <span class="type" id="info-type">System</span>
      
      <div class="mls-correlation">
        <h4>In MLS</h4>
        <p id="info-desc" style="margin-bottom: 0;"></p>
      </div>
      
      <a href="#" class="mls-link" id="info-mls-link">View related course →</a>
    </div>

    <div class="instructions">
      <span><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> to Pan</span>
      <span><span class="key-badge">Q</span><span class="key-badge">E</span> to Zoom</span>
      <span>🖱️ Left-click to rotate</span>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

      <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const container = document.getElementById('canvas-container');
    const infoPanel = document.getElementById('info-panel');
    const infoTitle = document.getElementById('info-title');
    const infoType = document.getElementById('info-type');
    const infoDesc = document.getElementById('info-desc');
    const infoMlsLink = document.getElementById('info-mls-link');
    const toggleContainer = document.getElementById('system-toggles');
    const loadingText = document.querySelector('#loading p');

    const mlsData = {
      'heart': { type: 'Cardiovascular', inMls: 'Cardiac markers like Troponin I and CK-MB are measured here. Blood typing is vital.', link: 'course-clinical-chemistry.html', linkText: 'Clinical Chemistry' },
      'liver': { type: 'Digestive', inMls: 'Liver Function Tests (ALT, AST, Bilirubin) are core.', link: 'course-clinical-chemistry.html', linkText: 'Clinical Chemistry' },
      'kidney': { type: 'Urinary', inMls: 'Urinalysis and BUN assess renal function.', link: 'course-analysis-of-urine.html', linkText: 'Urinalysis' },
      'lung': { type: 'Respiratory', inMls: 'Sputum cultures for Mycobacterium tuberculosis are vital.', link: 'course-microbiology.html', linkText: 'Microbiology' },
      'brain': { type: 'Nervous', inMls: 'Cerebrospinal fluid (CSF) is analyzed to diagnose meningitis.', link: 'course-analysis-of-urine.html', linkText: 'Body Fluids' },
      'bone': { type: 'Skeletal', inMls: 'Bone marrow is the site of hematopoiesis.', link: 'course-clinical-hematology.html', linkText: 'Hematology' }
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0f1a26');
    
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 2.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 3.0);
    dirLight.position.set(2, 3, 4);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight2.position.set(-2, 1, -3);
    scene.add(dirLight2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.listenToKeyEvents(window);
    controls.keys = { LEFT: 'KeyA', UP: 'KeyW', RIGHT: 'KeyD', BOTTOM: 'KeyS' };

    document.addEventListener('keydown', (e) => {
      const moveSpeed = 0.1;
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      if (e.code === 'KeyE') { camera.position.add(forward.multiplyScalar(moveSpeed)); controls.target.add(forward.multiplyScalar(moveSpeed)); }
      if (e.code === 'KeyQ') { camera.position.sub(forward.multiplyScalar(moveSpeed)); controls.target.sub(forward.multiplyScalar(moveSpeed)); }
    });

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    let bodyModel = null;

    loader.load('assets/models/body.glb', (gltf) => {
      bodyModel = gltf.scene;
      
      bodyModel.traverse((child) => {
        if (child.isMesh) {
          child.material.transparent = true;
          child.material.opacity = 0.95;
        }
      });
      
      scene.add(bodyModel);
      document.getElementById('loading').classList.add('hidden');
      
      const box = new THREE.Box3().setFromObject(bodyModel);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const distance = maxDim * 2.5; 
      
      controls.target.copy(center);
      camera.position.set(center.x, center.y, center.z + distance);
      camera.updateProjectionMatrix();
      controls.update();

    }, 
    (xhr) => {
      if (xhr.total > 0 && loadingText) {
        const percent = Math.round((xhr.loaded / xhr.total) * 100);
        loadingText.textContent = `Loading anatomy… ${percent}%`;
      }
    }, 
    (error) => {
      console.error('Error loading body.glb:', error);
      if (loadingText) loadingText.textContent = 'Failed to load model. Check console (F12).';
    });

    // Sidebar Setup
    toggleContainer.innerHTML = `
      <div class="toggle-row">
        <span class="toggle-label">Human Body Model</span>
        <label class="toggle-switch">
          <input type="checkbox" checked id="toggle-body">
          <span class="slider"></span>
        </label>
      </div>
    `;
    document.getElementById('toggle-body').addEventListener('change', (e) => {
      if (bodyModel) bodyModel.visible = e.target.checked;
    });

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let lastHighlighted = null;

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return; 
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      if (!bodyModel) return;
      
      const intersects = raycaster.intersectObjects(bodyModel.children, true);
      
      if (lastHighlighted) {
        lastHighlighted.material.emissive.setHex(0x000000);
        lastHighlighted = null;
      }

      if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;
        lastHighlighted = clickedMesh;
        clickedMesh.material.emissive.setHex(0x333333);
        
        const rawName = clickedMesh.name || clickedMesh.parent.name || 'Unknown';
        const cleanName = rawName.replace(/_/g, ' ').toLowerCase();
        
        let matchedData = null;
        for (const [key, data] of Object.entries(mlsData)) {
          if (cleanName.includes(key)) { matchedData = data; break; }
        }
        
        infoTitle.textContent = rawName.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        
        if (matchedData) {
          infoType.textContent = matchedData.type;
          infoDesc.textContent = matchedData.inMls;
          infoMlsLink.href = matchedData.link;
          infoMlsLink.textContent = `Study ${matchedData.linkText} →`;
          infoMlsLink.style.display = 'inline-block';
        } else {
          infoType.textContent = 'Anatomical Structure';
          infoDesc.textContent = 'Click on a major organ to see its MLS correlation.';
          infoMlsLink.style.display = 'none';
        }
        infoPanel.classList.add('visible');
      } else {
        infoPanel.classList.remove('visible');
      }
    });

    document.getElementById('close-info').addEventListener('click', () => {
      infoPanel.classList.remove('visible');
      if (lastHighlighted) { lastHighlighted.material.emissive.setHex(0x000000); lastHighlighted = null; }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
